<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signing you in — Web Dev 101</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="browser">
    <div class="browser__bar">
      <div class="browser__dots"><span></span><span></span><span></span></div>
      <div class="browser__url"><span class="lock">&#128274;</span>yoursite.dev/verify</div>
    </div>

    <div class="browser__body">
      <p class="eyebrow">Web Dev 101</p>
      <h1 id="heading">Signing you in&hellip;</h1>

      <div class="status status--pending is-visible" id="status-pending">
        <span class="spinner"></span>
        <span>Confirming your magic link&hellip;</span>
      </div>

      <div class="status status--error" id="status-error">
        <span>&#9888;</span>
        <span id="error-text">That link looks invalid or expired. Head back and request a new one.</span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/appwrite@26.2.0"></script>
  <script src="js/appwrite-config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (async () => {
      const params = new URLSearchParams(window.location.search);
      const userId = params.get("userId");
      const secret = params.get("secret");
      const pending = document.getElementById("status-pending");
      const error = document.getElementById("status-error");
      const errorText = document.getElementById("error-text");
      const heading = document.getElementById("heading");

      if (!userId || !secret) {
        pending.classList.remove("is-visible");
        errorText.textContent = "This link is missing some info. Head back and request a new one.";
        error.classList.add("is-visible");
        heading.textContent = "Couldn't sign you in";
        return;
      }

      try {
        await completeMagicLinkLogin(userId, secret);
        window.location.href = "index.html";
      } catch (err) {
        pending.classList.remove("is-visible");
        errorText.textContent = err.message || "That link looks invalid or expired. Head back and request a new one.";
        error.classList.add("is-visible");
        heading.textContent = "Couldn't sign you in";
      }
    })();
  </script>
</body>
</html>
